<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Prototipo interattivo del modulo Personale" />
  <title>Personale — Prototipo interattivo</title>
  <style>
    :root {
      --ink: #0f194e;
      --ink-2: #23346f;
      --muted: #6575a0;
      --blue: #075eff;
      --blue-dark: #0048d8;
      --blue-soft: #eef4ff;
      --green: #00a47b;
      --green-soft: #eaf8f3;
      --orange: #ef7a00;
      --orange-soft: #fff3e3;
      --red: #e82d3a;
      --red-soft: #fff0f1;
      --purple: #7653d6;
      --purple-soft: #f3efff;
      --border: #dfe6f2;
      --border-strong: #cbd7eb;
      --surface: #fff;
      --page: #f7f9fd;
      --shadow: 0 7px 20px rgba(18, 42, 92, .07), 0 2px 6px rgba(18, 42, 92, .035);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html { background: var(--page); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: linear-gradient(180deg, #fbfdff 0%, #f6f8fc 100%);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(7, 94, 255, .20);
      outline-offset: 2px;
    }
    h1, h2, h3, h4, p { margin-top: 0; }
    .hidden { display: none !important; }

    .app-shell {
      width: min(100%, 1500px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 22px 26px;
    }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 10px;
    }
    .app-title h1 {
      margin: 0 0 4px;
      font-size: clamp(25px, 2.1vw, 31px);
      line-height: 1.1;
      letter-spacing: -.035em;
      font-weight: 780;
    }
    .app-title p { margin: 0; color: var(--ink-2); font-size: 14px; }

    .main-tabs, .detail-tabs {
      display: flex;
      align-items: stretch;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .main-tabs::-webkit-scrollbar, .detail-tabs::-webkit-scrollbar { display: none; }
    .main-tab, .detail-tab {
      position: relative;
      flex: 0 0 auto;
      min-height: 46px;
      padding: 0 15px;
      border: 0;
      background: transparent;
      color: #22325f;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .main-tab::after, .detail-tab::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -1px;
      height: 2px;
      border-radius: 999px;
      background: transparent;
    }
    .main-tab:hover, .detail-tab:hover { background: #f5f8ff; }
    .main-tab.active, .detail-tab.active { color: var(--blue); }
    .main-tab.active::after, .detail-tab.active::after { background: var(--blue); }

    .view-root { padding-top: 12px; }
    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .section-card { padding: 15px 16px; }
    .section-card + .section-card { margin-top: 12px; }
    .card-title-row, .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .card-title-row h2, .section-title-row h3 {
      margin: 0;
      letter-spacing: -.018em;
      font-weight: 760;
    }
    .card-title-row h2 { font-size: 21px; }
    .section-title-row h3 { font-size: 16px; }
    .subtle { color: var(--muted); }
    .count-inline { color: var(--muted); margin-left: 10px; font-size: 13px; font-weight: 500; }

    .btn {
      min-height: 38px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: .16s ease;
      white-space: nowrap;
    }
    .btn:hover { background: #f5f8ff; border-color: #a9bfeb; transform: translateY(-1px); }
    .btn.primary { color: #fff; border-color: var(--blue); background: var(--blue); box-shadow: 0 5px 12px rgba(7,94,255,.18); }
    .btn.primary:hover { background: var(--blue-dark); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.danger { color: var(--red); border-color: #f3a7ad; }
    .btn.icon-only { width: 38px; padding: 0; }
    .link-btn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--blue);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }
    .icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
    .icon.small { width: 15px; height: 15px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(250px, 1.5fr) repeat(3, minmax(150px, .8fr)) auto;
      gap: 10px;
      margin: 16px 0 12px;
    }
    .toolbar.compact { grid-template-columns: minmax(220px, 1.35fr) repeat(3, minmax(135px, .8fr)) auto; }
    .control {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      font-size: 13px;
    }
    .control::placeholder { color: #8390ae; }
    .search-wrap { position: relative; }
    .search-wrap .control { padding-left: 37px; }
    .search-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      color: #7180a4;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .table-wrap { position: relative; overflow-x: auto; scrollbar-width: thin; }
    .table-wrap::after {
      content: "";
      position: sticky;
      right: 0;
      float: right;
      width: 14px;
      height: 1px;
      box-shadow: 10px 0 18px 9px rgba(20,42,88,.08);
      pointer-events: none;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #fff;
      padding: 11px 10px;
      color: #1d2a59;
      text-align: left;
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px;
      border-bottom: 1px solid #e7edf6;
      color: #24366c;
      font-size: 12.5px;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: 0; }
    .click-row { cursor: pointer; transition: background .14s ease; }
    .click-row:hover { background: #f7faff; }
    .name-cell { display: flex; align-items: center; gap: 10px; min-width: 150px; }
    .name-cell strong { color: var(--blue); }
    .meta-stack { display: flex; flex-direction: column; gap: 3px; }
    .meta-stack small { color: var(--muted); font-size: 11px; }
    .avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #edf4ff, #d7e6ff);
      border: 1px solid #cddcf4;
      color: #194695;
      font-size: 12px;
      font-weight: 800;
    }
    .avatar.large { width: 56px; height: 56px; flex-basis: 56px; font-size: 17px; }
    .avatar.green { background: linear-gradient(145deg,#eefaf5,#d5f0e7); color:#08775c; border-color:#bfe4d6; }
    .avatar.orange { background: linear-gradient(145deg,#fff8ed,#ffe6c3); color:#a95500; border-color:#f4d4a8; }
    .avatar.purple { background: linear-gradient(145deg,#f6f1ff,#e6dcff); color:#6543b0; border-color:#d9cdf5; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid #d2dff5;
      background: var(--blue-soft);
      color: #1552c7;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.green { background: var(--green-soft); border-color: #caebdf; color: #07805f; }
    .badge.orange { background: var(--orange-soft); border-color: #f7d7b1; color: #c45c00; }
    .badge.red { background: var(--red-soft); border-color: #f5c6ca; color: #ce2733; }
    .badge.gray { background: #f2f4f8; border-color: #e0e5ee; color: #69758f; }
    .badge.purple { background: var(--purple-soft); border-color: #dfd5fa; color: #6845bf; }
    .badge-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .status-counts { display: flex; align-items: center; gap: 11px; white-space: nowrap; }
    .status-count { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 9px; }
    .dot.green { background: var(--green); }
    .dot.orange { background: var(--orange); }
    .dot.red { background: var(--red); }
    .dot.blue { background: var(--blue); }
    .dot.gray { background: #a9b3c6; }
    .dot.purple { background: var(--purple); }
    .dot.cyan { background: #16a7b6; }

    .view-meta {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 7px 11px;
      border: 1px solid #dbe5f4;
      border-radius: 8px;
      background: #f9fbff;
      color: var(--muted);
      font-size: 11.5px;
    }
    .view-meta strong { color: var(--ink-2); }
    .view-meta .status-legend { margin-left: auto; }
    .status-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; color: var(--ink-2); font-size: 11.5px; }
    .status-legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

    .people-full { padding: 16px 18px 13px; }
    .people-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 13px; color: var(--muted); font-size: 12px; }
    .pagination { display: flex; gap: 6px; align-items: center; }
    .page-btn { width: 33px; height: 33px; border: 1px solid var(--border); background: #fff; border-radius: 7px; cursor: pointer; color: #324477; }
    .page-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    .people-table { min-width: 1000px; }
    .people-table th:first-child, .people-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #fff;
      box-shadow: 8px 0 14px -13px rgba(19,42,91,.55);
    }
    .people-table th:first-child { z-index: 5; }
    .people-table .click-row:hover td:first-child { background: #f7faff; }
    .people-table .roles-column { max-width: 310px; }
    .people-table .relationship-column { min-width: 118px; }
    .people-table .requirements-column { min-width: 138px; }

    .detail-layout { display: grid; grid-template-columns: 212px minmax(0,1fr); gap: 12px; min-height: calc(100vh - 142px); }
    .detail-layout.full { grid-template-columns: minmax(0,1fr); }
    .people-rail { position: sticky; top: 10px; align-self: start; max-height: calc(100vh - 20px); overflow-y: auto; padding: 12px 8px; min-width: 0; }
    .rail-head { padding: 5px 5px 10px; }
    .rail-head h2 { margin: 0 0 13px; font-size: 18px; }
    .rail-search { margin: 3px 5px 11px; }
    .rail-person {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--blue);
      padding: 7px 8px;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
      font-size: 13px;
    }
    .rail-person:hover { background: #f3f7ff; }
    .rail-person.active { background: #eaf2ff; box-shadow: inset 3px 0 0 var(--blue); }
    .rail-person .avatar { width: 32px; height: 32px; flex-basis: 32px; }
    .detail-panel { min-width: 0; overflow: visible; }
    .detail-sticky {
      position: sticky;
      top: 0;
      z-index: 20;
      padding-top: 1px;
      background: rgba(255,255,255,.97);
      border-radius: var(--radius) var(--radius) 0 0;
      backdrop-filter: blur(8px);
      box-shadow: 0 7px 13px -14px rgba(15,34,82,.8);
    }
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 16px 4px;
    }
    .profile-head { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .profile-name-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 3px; }
    .profile-copy h2 { margin: 0; font-size: 21px; line-height: 1.1; letter-spacing: -.025em; }
    .profile-copy p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
    .profile-actions { display: flex; gap: 8px; flex: none; }
    .detail-tabs { margin: 0 16px; box-shadow: inset -18px 0 18px -23px rgba(17,42,92,.85); }
    .detail-tab { min-height: 44px; padding-inline: 11px; font-size: 13px; }
    .detail-content { padding: 13px 16px 16px; }
    .detail-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .detail-heading h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.02em; }
    .detail-heading p { margin: 0; color: var(--ink-2); font-size: 13px; }
    .section-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
    .kpi-grid.six { grid-template-columns: repeat(6,minmax(0,1fr)); }
    .kpi-grid.five { grid-template-columns: repeat(5,minmax(0,1fr)); }
    .kpi {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 13px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .kpi-icon {
      width: 39px;
      height: 39px;
      flex: 0 0 39px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid #d7e3f8;
    }
    .kpi-icon.green { color: var(--green); background: var(--green-soft); border-color: #caeadf; }
    .kpi-icon.orange { color: var(--orange); background: var(--orange-soft); border-color: #f6daba; }
    .kpi-icon.red { color: var(--red); background: var(--red-soft); border-color: #f5cbd0; }
    .kpi strong { display: block; font-size: 20px; line-height: 1.05; margin-bottom: 4px; }
    .kpi span { color: var(--ink-2); font-size: 11.5px; line-height: 1.25; }
    button.kpi { width: 100%; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
    .kpi.actionable { transition: .16s ease; }
    .kpi.actionable:hover { border-color: #aac1ec; background: #f9fbff; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(18,42,92,.07); }

    .person-status-banner { display: grid; grid-template-columns: minmax(360px,1.7fr) repeat(3,minmax(145px,1fr)); gap: 12px; margin-bottom: 12px; }
    .status-overview-main { min-width: 0; min-height: 106px; display: flex; align-items: center; gap: 18px; padding: 16px 18px; border: 1px solid #cde8de; border-radius: 10px; background: linear-gradient(135deg,#fff 15%,#f1fbf7 100%); box-shadow: var(--shadow); color: var(--ink); text-align: left; font: inherit; cursor: pointer; transition: .16s ease; }
    .status-overview-main:hover { border-color: #9fd6c4; background: linear-gradient(135deg,#fbfffd 15%,#eaf8f3 100%); transform: translateY(-1px); }
    .compliance-ring { width: 82px; height: 82px; flex: 0 0 82px; display: grid; place-items: center; position: relative; border-radius: 50%; background: conic-gradient(var(--green) 0 71%,#e5ebf3 71% 100%); }
    .compliance-ring::after { content: ""; position: absolute; width: 61px; height: 61px; border-radius: 50%; background: #fff; }
    .compliance-ring strong { position: relative; z-index: 1; font-size: 22px; }
    .compliance-copy h3 { margin: 0 0 4px; font-size: 16px; }
    .compliance-copy p { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
    .status-overview-metric { min-width: 0; min-height: 106px; display: flex; align-items: center; justify-content: center; gap: 11px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 10px; background: #fff; box-shadow: var(--shadow); color: var(--ink); text-align: left; font: inherit; cursor: pointer; transition: .16s ease; }
    .status-overview-metric:hover { border-color: #aac1ec; background: #f8fbff; transform: translateY(-1px); }
    .status-overview-metric .metric-copy { min-width: 0; }
    .status-overview-metric strong { display: block; font-size: 21px; line-height: 1; }
    .status-overview-metric small { display: block; margin-top: 5px; color: var(--ink-2); font-size: 11.5px; line-height: 1.25; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .two-col.asym { grid-template-columns: 1.12fr .88fr; }
    .three-col { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
    .mini-list { margin-top: 9px; }
    .mini-row {
      min-height: 45px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #e7edf6;
      color: #263870;
      font-size: 12.5px;
    }
    .mini-row:last-child { border-bottom: 0; }
    .mini-row small { color: var(--muted); display: block; margin-top: 3px; }
    button.mini-row { width: 100%; border: 0; border-bottom: 1px solid #e7edf6; background: transparent; text-align: left; cursor: pointer; }
    button.mini-row:hover { background: #f8fbff; }
    .progress-list { margin-top: 8px; }
    .progress-item { display: grid; grid-template-columns: 1fr 125px 42px; gap: 11px; align-items: center; min-height: 40px; border-bottom: 1px solid #edf1f7; font-size: 12px; }
    .progress-item:last-child { border-bottom: 0; }
    button.progress-item { width: 100%; border: 0; border-bottom: 1px solid #edf1f7; background: transparent; color: inherit; text-align: left; cursor: pointer; }
    button.progress-item:hover { background: #f8fbff; }
    .progress-track { height: 7px; border-radius: 999px; background: #e8edf5; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--blue); }
    .progress-fill.green { background: var(--green); }
    .progress-fill.orange { background: var(--orange); }
    .progress-fill.red { background: var(--red); }

    .field-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 11px 13px; margin-top: 12px; }
    .field {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfdff;
      padding: 10px 11px;
    }
    .field.span-2 { grid-column: span 2; }
    .field label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 5px; font-weight: 650; }
    .field-value { color: var(--ink); min-height: 20px; overflow-wrap: anywhere; font-weight: 600; font-size: 13px; }
    .field input, .field select {
      width: 100%;
      height: 34px;
      border: 1px solid #b9c9e4;
      border-radius: 6px;
      background: #fff;
      padding: 0 9px;
      color: var(--ink);
    }
    .field-section + .field-section { margin-top: 12px; }
    details.optional-data { margin-top: 12px; }
    details.optional-data > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 750; }
    details.optional-data > summary::-webkit-details-marker { display: none; }
    details.optional-data > summary::after { content: "⌄"; color: var(--blue); font-size: 17px; transition: transform .18s ease; }
    details.optional-data[open] > summary::after { transform: rotate(180deg); }
    details.embedded-details { margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--border); }
    details.embedded-details > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--ink); font-size: 13px; font-weight: 760; }
    details.embedded-details > summary::-webkit-details-marker { display: none; }
    details.embedded-details > summary::after { content: "⌄"; color: var(--blue); font-size: 17px; transition: transform .18s ease; }
    details.embedded-details[open] > summary::after { transform: rotate(180deg); }
    .record-kind { display: inline-flex; min-width: 80px; align-items: center; gap: 6px; color: var(--ink-2); font-size: 11px; font-weight: 720; }
    button.level-card { width: 100%; display: flex; align-items: center; gap: 12px; color: var(--ink); text-align: left; font: inherit; cursor: pointer; transition: .16s ease; }
    button.level-card:hover { border-color: #a7bde7; background: #f9fbff; transform: translateY(-1px); box-shadow: 0 7px 18px rgba(18,42,92,.08); }
    button.level-card.selected { border-color: var(--blue); background: #f7faff; box-shadow: 0 0 0 2px rgba(9,94,244,.12), 0 8px 20px rgba(18,42,92,.09); transform: translateY(-1px); }
    .macro-value-copy { min-width: 0; flex: 1; }
    .macro-value-copy > strong { display: block; font-size: 15px; margin-bottom: 5px; }

      function renderHealth() {

        <div class="two-col asym"><section class="card section-card"><div class="section-title-row"><h3>Storico visite</h3><button class="link-btn" data-toast="Storico completo simulato">Mostra tutte</button></div><div class="table-wrap"><table><thead><tr><th>Tipo visita</th><th>Data</th><th>Giudizio</th><th>Scadenza</th><th>Documento</th><th>Stato</th></tr></thead><tbody><tr><td>Preventiva</td><td>01/01/2020</td><td>${badge('Idoneo','green')}</td><td>01/01/2021</td><td>${icon('lock','small')} Riservato</td><td>${badge('Valida','green')}</td></tr><tr><td>Periodica</td><td>12/08/2024</td><td>${badge('Idoneo','green')}</td><td>15/08/2025</td><td>${icon('lock','small')} Riservato</td><td>${badge('Valida','green')}</td></tr><tr><td>Periodica</td><td>15/08/2025</td><td>${badge('Idoneo','green')}</td><td>15/08/2026</td><td>${icon('lock','small')} Riservato</td><td>${badge('Valida','green')}</td></tr></tbody></table></div></section>
          <div><section class="card section-card"><div class="section-title-row"><h3>Prossima attività</h3></div><div style="margin-top:12px"><strong>Visita periodica · 15/08/2026</strong><p class="subtle" style="margin:7px 0 12px">Medico competente<br>Dott.ssa Laura Bianchi</p><div class="badge-group"><button class="btn primary" data-modal="plan-visit">Pianifica</button><button class="btn" data-toast="Promemoria inviato">${icon('bell','small')} Promemoria</button></div></div></section><section class="card section-card"><div class="section-title-row"><h3>Esposizioni associate</h3><span class="subtle" style="font-size:11px">Sola lettura</span></div><div class="badge-group" style="margin:12px 0">${badge('Rumore')}${badge('Vibrazioni')}${badge('Movimentazione carichi')}</div><p class="subtle" style="margin:0 0 10px">Fonte: modulo Sicurezza · Valutazione dei rischi</p><button class="link-btn" data-toast="Protocollo sanitario simulato">Apri nel modulo Sicurezza</button></section></div>
        </div>`;

      function renderSkills() {
        return `<div class="detail-heading"><div><h3>Conoscenza, competenza e consapevolezza</h3><p>Il profilo individuale combina automaticamente le voci previste da profilo generale, mansione e ruoli assegnati</p></div></div>
        <div class="three-col competency-macro-grid">${Object.entries(competencyMacroData).map(([key,item])=>macroValueCard(key,item)).join('')}</div>
        ${state.activeCompetencyMacro?renderCompetencyDetail(state.activeCompetencyMacro):''}
        <section class="card section-card" style="margin-top:12px"><div class="section-title-row"><div><h3>Titoli di studio</h3><span class="subtle" style="font-size:11px">Titoli dichiarati e relative evidenze documentali</span></div><button class="link-btn" data-modal="new-degree">+ Aggiungi titolo</button></div><div class="table-wrap"><table class="study-table"><thead><tr><th>Titolo</th><th>Indirizzo / specializzazione</th><th>Istituto o ateneo</th><th>Anno</th><th>Documento</th><th>Stato</th><th>Azioni</th></tr></thead><tbody><tr><td><strong>Laurea magistrale</strong></td><td>Economia e gestione aziendale</td><td>Ca’ Foscari Venezia</td><td>2009</td><td><span style="color:var(--blue)">${icon('document','small')} Presente</span></td><td>${badge('Verificato','green')}</td><td><button class="btn icon-only" style="min-height:31px;width:31px" data-toast="Modifica titolo simulata">${icon('pencil','small')}</button></td></tr><tr><td><strong>Diploma di ragioneria</strong></td><td>Amministrazione e contabilità</td><td>I.T.C. Venezia</td><td>2004</td><td><span class="subtle">Non allegato</span></td><td>${badge('Dichiarato','orange')}</td><td><button class="btn icon-only" style="min-height:31px;width:31px" data-toast="Modifica titolo simulata">${icon('pencil','small')}</button></td></tr></tbody></table></div></section>
        <details class="card section-card optional-data"><summary><span>Esperienze rilevanti <small class="subtle" style="margin-left:7px">2 esperienze registrate · chiuse per impostazione predefinita</small></span></summary><div class="mini-list"><div class="mini-row"><div><strong>Amministratore</strong><small>Esperienza organizzativa · impresa attuale</small></div><strong>2020–oggi</strong>${badge('Verificata','green')}</div><div class="mini-row"><div><strong>Responsabile operativo</strong><small>Esperienza professionale · organizzazione precedente</small></div><strong>2015–2019</strong>${badge('Dichiarata','orange')}</div></div><div style="margin-top:12px"><button class="btn" data-modal="new-experience">${icon('plus','small')} Aggiungi esperienza</button></div></details>`;
      }
      function levelSegments(n) { return `<span class="level-bars" style="width:64px;margin:0">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`; }
      function activeCompetencySources(row) {
        const disabled=row.disabledSources||[];
        return row.sources.filter(source=>source==='Voce personale'||!disabled.includes(source));
      }
      function competencyMetrics(item) {
        const applicable=item.rows.filter(row=>row.personal||activeCompetencySources(row).length>0);
        const visible=applicable.filter(row=>!row.hidden);
        const hidden=applicable.filter(row=>row.hidden);
        const evaluated=visible.filter(row=>Number.isInteger(row.levelNumber));
        const complete=visible.length>0 && evaluated.length===visible.length;
        const levelNumber=evaluated.length?Math.round(evaluated.reduce((sum,row)=>sum+row.levelNumber,0)/evaluated.length):0;
        const levels={1:'Base',2:'Intermedia',3:'Avanzata'};
        const tone=!complete?'orange':levelNumber===3?'green':levelNumber===2?'orange':levelNumber===1?'red':'gray';
        return {visible,hidden,evaluated,complete,levelNumber,tone,label:complete?(levels[levelNumber]||'Non valutata'):'Da completare'};
      }
      function macroValueCard(key,item) {
        const selected=state.activeCompetencyMacro===key;
        const metrics=competencyMetrics(item);
        const summary=`${metrics.visible.length} ${metrics.visible.length===1?'voce attiva':'voci attive'}${metrics.hidden.length?` · ${metrics.hidden.length} ${metrics.hidden.length===1?'nascosta':'nascoste'}`:''} · aggiornata ${item.updated}`;
        return `<button type="button" class="card level-card ${selected?'selected':''}" data-competency-macro="${key}" aria-expanded="${selected}" aria-controls="competencyDetail" aria-label="${selected?'Chiudi':'Apri'} la composizione di ${item.title}"><span class="kpi-icon ${metrics.tone}">${icon(metrics.tone==='green'?'check':metrics.tone==='red'?'warning':'clock')}</span><span class="macro-value-copy"><strong>${item.title}</strong><span class="macro-value-level"><span>${metrics.label}</span>${levelSegments(metrics.levelNumber)}</span><small class="subtle">${summary}</small></span></button>`;
      }
      function competencySourceChips(row) { const sources=activeCompetencySources(row); const first=sources[0]||'—'; return `<span class="source-list"><span class="source-chip ${first==='Voce personale'?'personal':''}">${first}${sources.length>1?` +${sources.length-1}`:''}</span></span>`; }
      function competencyLevelBadge(row) { return row.level?badge(row.level,row.levelNumber===3?'green':row.levelNumber===2?'orange':'red'):badge('Non valutata','gray'); }
      function competencyNormalRow(key,row) {
        return `<tr><td><div class="competency-name-cell"><strong>${row.name}</strong><small>${row.description}<br>${competencySourceChips(row)}</small></div></td><td>${competencyLevelBadge(row)}</td><td><strong>${row.updated}</strong><small class="subtle">${row.evaluator}</small></td><td><button type="button" class="btn ghost icon-only" data-hide-competency="${row.id}" data-macro-key="${key}" title="Nascondi dal profilo individuale" aria-label="Altre azioni per ${row.name}">${icon('more','small')}</button></td></tr>`;
      }
      function renderPersonalCompetencyForm(key,item) {
        return `<form id="competencyPersonalForm" class="competency-editor" data-macro-key="${key}"><div class="competency-editor-head"><div><h4>Nuova voce personalizzata di ${item.title}</h4><span class="subtle">La voce sarà aggiunta soltanto al profilo di questa persona.</span></div><button type="button" class="btn icon-only" data-cancel-competency-add aria-label="Annulla aggiunta">${icon('close')}</button></div><div class="competency-editor-grid"><label class="modal-field">Nome della voce *<input class="control" name="competencyName" required placeholder="Es. Procedure commessa specifica"></label><label class="modal-field">Descrizione<input class="control" name="competencyDescription" placeholder="Cosa deve essere conosciuto o dimostrato"></label><label class="modal-field">Scala<select class="control" name="competencyScale"><option>Tre livelli</option></select></label></div><div class="competency-editor-actions"><button type="button" class="btn" data-cancel-competency-add>Annulla</button><button type="submit" class="btn primary">${icon('check','small')} Aggiungi al profilo</button></div></form>`;
      }
      function renderCompetencyEvaluation(key,item,visible) {
        return `<form id="competencyEvaluationForm" data-macro-key="${key}"><div class="competency-evaluation-meta"><label class="modal-field">Data valutazione<input class="control" name="evaluationDate" type="date" value="2026-09-03" required></label><label class="modal-field">Valutatore<input class="control" name="evaluationEvaluator" value="Laura Conti" required></label><label class="modal-field full-mobile">Nota generale<input class="control" name="evaluationNote" placeholder="Evidenze o osservazioni comuni"></label></div><div class="table-wrap"><table class="competency-evaluation-table"><thead><tr><th>Voce</th><th>Fonte</th><th>Valutazione precedente</th><th>Nuova valutazione</th><th>Evidenza / nota</th></tr></thead><tbody>${visible.map(row=>`<tr><td><div class="competency-name-cell"><strong>${row.name}</strong><small>${row.description}</small></div></td><td>${competencySourceChips(row)}</td><td>${competencyLevelBadge(row)}</td><td><select class="control" data-evaluation-row="${row.id}" aria-label="Nuova valutazione per ${row.name}"><option value="1" ${row.levelNumber===1?'selected':''}>Base</option><option value="2" ${row.levelNumber===2?'selected':''}>Intermedio</option><option value="3" ${row.levelNumber===3?'selected':''}>Avanzato</option></select></td><td><input class="control" data-evaluation-note="${row.id}" placeholder="Nota facoltativa"></td></tr>`).join('')}</tbody></table></div><div class="helper-panel"><strong>Valori precedenti riproposti:</strong> puoi modificare soltanto le voci cambiate. Il salvataggio registra una nuova valutazione datata senza cancellare lo storico.</div><div class="competency-editor-actions"><button type="button" class="btn" data-cancel-competency-evaluation>Annulla</button><button type="submit" class="btn primary">${icon('check','small')} Salva valutazione</button></div></form>`;
      }
      function renderHiddenCompetencies(key,hidden) {
        if(!hidden.length) return '';
        return `<details class="competency-hidden"><summary>Voci nascoste (${hidden.length}) <span class="subtle">Escluse dalla valutazione e dal calcolo del macrovalore</span></summary><div class="hidden-competency-list">${hidden.map(row=>`<div class="hidden-competency-row"><div class="competency-name-cell"><strong>${row.name}</strong><small>${row.description}</small></div>${competencySourceChips(row)}<button type="button" class="btn" data-restore-competency="${row.id}" data-macro-key="${key}">${icon('eye','small')} Ripristina</button></div>`).join('')}</div></details>`;
      }
      function renderCompetencyDetail(key) {
        const item=competencyMacroData[key];
        if(!item) return '';
        const metrics=competencyMetrics(item);
        const evaluating=state.competencyEvaluationKey===key;
        const pointer={knowledge:'16.666%',competence:'50%',awareness:'83.333%'}[key];
        return `<div class="competency-detail-wrap" id="competencyDetail" style="--pointer-x:${pointer}"><section class="card section-card competency-inline-card"><div class="section-title-row"><div><h3>Profilo individuale · ${item.title}</h3><span class="subtle" style="font-size:11px">${metrics.visible.length} voci attive${metrics.hidden.length?` · ${metrics.hidden.length} nascoste`:''} · ${item.description}</span></div><div class="section-actions">${evaluating?'':`<button class="btn primary" data-start-competency-evaluation="${key}">${icon('check','small')} Valuta</button>`}<button class="btn icon-only" type="button" data-close-competency aria-label="Chiudi dettaglio">${icon('close')}</button></div></div><div class="competency-profile-note">${icon('shield','small')}<span>Le voci sono ereditate da <strong>mansione e ruoli assegnati</strong>. La loro configurazione avviene dalla sezione <strong>Ruoli</strong>; qui puoi soltanto valutare, aggiungere un’eccezione personale o nascondere una voce non pertinente.</span></div>${state.competencyAdding?renderPersonalCompetencyForm(key,item):''}${evaluating?renderCompetencyEvaluation(key,item,metrics.visible):`<div class="table-wrap"><table class="competency-detail-table" style="min-width:680px"><thead><tr><th>Voce e origine</th><th>Valutazione</th><th>Ultimo aggiornamento</th><th></th></tr></thead><tbody>${metrics.visible.map(row=>competencyNormalRow(key,row)).join('')}</tbody></table></div><div style="margin-top:12px"><button class="link-btn" data-add-personal-competency="${key}">${icon('plus','small')} Aggiungi voce personale</button></div>`}${evaluating?'':renderHiddenCompetencies(key,metrics.hidden)}</section></div>`;

">Descrizione<input class="control" name="baseCompetencyDescription" placeholder="Cosa deve essere conosciuto, applicato o compreso"></label><button type="submit" class="btn primary">${icon('plus','small')} Aggiungi al profilo</button></div></form><div class="helper-panel"><strong>Disattivazione non distruttiva:</strong> una voce disattivata non viene più ereditata da questa fonte, ma le valutazioni già registrate restano nello storico.</div></section></div>`;

      function matrixStatus(tone,personId,targetTab,category) {
        const labels={green:'Valido',orange:'Scadenza',red:'Scaduto',blue:'Pianificato',gray:'Nessun dato'};
        const reasons={green:'Le registrazioni presenti risultano valide',orange:'È presente almeno una registrazione prossima alla scadenza',red:'È presente almeno una registrazione scaduta',blue:'È presente un’attività pianificata non ancora completata',gray:'Non risultano informazioni registrate per questa categoria'};
        return `<button type="button" class="matrix-status" data-open-category="${personId}" data-target-tab="${targetTab}" title="${category}: ${reasons[tone]}"><i class="dot ${tone}"></i>${labels[tone]}</button>`;
      }
      function matrixRow(p,tones,date) {
        const categories=[['training','Formazione e abilitazioni'],['health','Idoneità sanitaria'],['roles','Ruoli'],['profile','Documenti']];
        const noAnomalies=tones.every(t=>t==='green');
        return `<tr class="${noAnomalies?'conform-row':''}"><td><div class="name-cell">${avatar(p)}<strong>${p.name}</strong></div></td><td><div class="meta-stack"><strong>${p.job}</strong><small>${p.dept}</small></div></td>${tones.map((t,i)=>`<td>${matrixStatus(t,p.id,categories[i][0],categories[i][1])}</td>`).join('')}<td><button type="button" class="link-btn" data-open-person="${p.id}" data-target-tab="overview" title="Apri la prossima scadenza">${date}</button></td></tr>`;
      }

      }

        </div></section></div>`;
        requestAnimationFrame(()=>document.getElementById('matrixDetailSearch')?.focus());

      function filterMatrixDetail() {
        const search=(document.getElementById('matrixDetailSearch')?.value||'').trim().toLowerCase();
        const dept=document.querySelector('[data-matrix-filter="dept"]')?.value||'';
        const overall=document.querySelector('[data-matrix-filter="overall"]')?.value||'';
        let visible=0;
        document.querySelectorAll('[data-matrix-row]').forEach(row=>{
          const show=(!search||row.dataset.search.includes(search))&&(!dept||row.dataset.dept===dept)&&(!overall||row.dataset.overall===overall);
          row.classList.toggle('hidden',!show);
          if(show) visible++;
        });
        const count=document.getElementById('matrixDetailCount');
        if(count) count.innerHTML=`<strong>${visible} ${visible===1?'persona visualizzata':'persone visualizzate'}</strong> su 87 complessive`;
      }

      function openModal(kind) {
        if (kind === 'focus-note') { state.noteComposer=true; render(); requestAnimationFrame(()=>document.getElementById('noteText')?.focus()); return; }
        const configs = {
          'new-person':['Nuova persona','Crea l’anagrafica e il primo rapporto con l’azienda.'],
          'new-role':['Assegna un ruolo','Registra incarico, durata ed eventuale documento.'],
          'new-training':['Registra formazione','Collega corso, partecipazione, attestato e validità.'],
          'plan-course':['Pianifica un corso','Crea la sessione e seleziona le persone coinvolte.'],
          'new-ability':['Aggiungi abilitazione','Registra tipologia, validità ed eventuale documento.'],
          'new-visit':['Registra visita','Salva giudizio d’idoneità, periodicità e documento protetto.'],
          'plan-visit':['Pianifica visita','Imposta appuntamento, medico e promemoria.'],
          'new-degree':['Aggiungi titolo di studio','Seleziona il titolo dal catalogo e allega l’evidenza.'],
          'new-experience':['Aggiungi esperienza','Registra un’esperienza professionale rilevante.'],
          'new-reminder':['Nuovo promemoria','Imposta scadenza, destinatari e ricorrenza.']
        };
        const c=configs[kind] || ['Nuovo elemento','Compila le informazioni richieste.'];
        document.getElementById('modalRoot').innerHTML = `<div class="modal-layer" role="presentation" data-close-modal><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${c[0]}</h2><p class="subtle" style="margin:6px 0 0">${c[1]}</p></div><button class="btn icon-only" data-close-modal aria-label="Chiudi">${icon('close')}</button></div><form id="modalForm">${modalBody(kind)}<div class="modal-actions"><button class="btn" type="button" data-close-modal>Annulla</button><button class="btn primary" type="submit">${icon('check','small')} Salva</button></div></form></section></div>`;
      }
      function openUnsavedDialog() {
        document.getElementById('modalRoot').innerHTML=`<div class="modal-layer" role="presentation"><section class="modal unsaved-modal" role="dialog" aria-modal="true" aria-labelledby="unsavedTitle"><div class="modal-head"><div class="unsaved-title"><span class="kpi-icon orange">${icon('warning')}</span><div><h2 id="unsavedTitle">Modifiche non salvate</h2><p class="subtle" style="margin:6px 0 0">Hai modificato i dati della persona. Se esci senza salvare, le modifiche andranno perse.</p></div></div><button class="btn icon-only" data-unsaved-continue aria-label="Chiudi">${icon('close')}</button></div><div class="unsaved-actions"><button type="button" class="btn" data-unsaved-continue>Continua a modificare</button><button type="button" class="btn danger" data-unsaved-discard>Esci senza salvare</button><button type="button" class="btn primary" data-unsaved-save>Salva ed esci</button></div></section></div>`;
      }
      function guardUnsaved(action) {
        if(state.editProfile && state.profileDirty){ state.pendingAction=action; openUnsavedDialog(); return; }
        action();
      }
      function finishPending(save=false) {
        const action=state.pendingAction;
        state.pendingAction=null;
        state.editProfile=false;
        state.profileDirty=false;
        closeModal();
        if(save) toast('Dati della persona salvati');
        if(action) action();
      }
      function closeModal(){ state.pendingAction=null; document.getElementById('modalRoot').innerHTML=''; }
      let toastTimer;
      function toast(message) { const root=document.getElementById('toastRoot'); root.innerHTML=`<div class="toast">${message}</div>`; clearTimeout(toastTimer); toastTimer=setTimeout(()=>root.innerHTML='',2600); }

      function handleAction(action) {
        if(action==='all-people'){ state.mainView='people'; state.selectedId=null; render(); return; }
        if(action==='person-expiring'){ state.mainView='schedule'; render(); toast('Scadenziario filtrato sulla persona selezionata'); return; }
        if(action==='person-expired'){ state.detailTab='training'; render(); toast('Mostrate le registrazioni scadute'); return; }
        if(action==='person-planned'){ state.mainView='schedule'; state.scheduleMode='list'; render(); toast('Mostrate le attività pianificate'); return; }
        if(action==='analytics-valid'){ state.mainView='control'; state.criticalOnly=false; render(); return; }
        if(action==='analytics-planned'){ state.mainView='schedule'; state.scheduleMode='list'; render(); toast('Mostrati i corsi pianificati'); return; }
        if(action==='matrix-full'){ openMatrixDetail(); return; }
        if(action.startsWith('control-')){ state.criticalOnly=!['control-valid','control-planned'].includes(action); render(); toast('Quadro filtrato in base all’indicatore selezionato'); return; }
        if(action.startsWith('schedule-')){ toast('Scadenziario filtrato in base all’indicatore selezionato'); return; }
      }

      document.addEventListener('click', e => {
        if(e.target.closest('[data-unsaved-continue]')){ state.pendingAction=null; document.getElementById('modalRoot').innerHTML=''; return; }
        if(e.target.closest('[data-unsaved-discard]')){ finishPending(false); return; }
        if(e.target.closest('[data-unsaved-save]')){ finishPending(true); return; }
        const main=e.target.closest('[data-main-view]'); if(main){ guardUnsaved(()=>{ state.mainView=main.dataset.mainView; state.editProfile=false; state.profileDirty=false; if(state.mainView!=='people') state.detailFull=false; render(); }); return; }
        const category=e.target.closest('[data-open-category]'); if(category){ guardUnsaved(()=>{ closeModal(); state.mainView='people'; state.selectedId=Number(category.dataset.openCategory); state.detailTab=category.dataset.targetTab||'overview'; state.detailFull=false; state.editProfile=false; state.profileDirty=false; render(); }); return; }
        const open=e.target.closest('[data-open-person]'); if(open){ guardUnsaved(()=>{ closeModal(); state.mainView='people'; state.selectedId=Number(open.dataset.openPerson); state.detailTab=open.dataset.targetTab||'overview'; state.detailFull=false; state.editProfile=false; state.profileDirty=false; render(); }); return; }
        const select=e.target.closest('[data-select-person]'); if(select){ guardUnsaved(()=>{ state.selectedId=Number(select.dataset.selectPerson); state.detailTab='overview'; state.editProfile=false; state.profileDirty=false; render(); }); return; }
        if(e.target.closest('[data-back-list]')||e.target.closest('[data-close-detail]')){ guardUnsaved(()=>{ state.selectedId=null; state.detailFull=false; state.detailTab='overview'; state.editProfile=false; state.profileDirty=false; render(); }); return; }
        if(e.target.closest('[data-toggle-full]')){ guardUnsaved(()=>{ state.detailFull=!state.detailFull; render(); }); return; }
        const tab=e.target.closest('[data-detail-tab]'); if(tab){ guardUnsaved(()=>{ state.detailTab=tab.dataset.detailTab; state.editProfile=false; state.profileDirty=false; render(); }); return; }
        if(e.target.closest('[data-edit-profile]')){ state.editProfile=true; state.profileDirty=false; render(); return; }
        if(e.target.closest('[data-cancel-profile]')){ guardUnsaved(()=>{ state.editProfile=false; state.profileDirty=false; render(); }); return; }
        if(e.target.closest('[data-save-profile]')){ state.editProfile=false; state.profileDirty=false; render(); toast('Dati della persona salvati'); return; }
        const action=e.target.closest('[data-action]'); if(action){ guardUnsaved(()=>handleAction(action.dataset.action)); return; }
        const scheduleMode=e.target.closest('[data-schedule-mode]'); if(scheduleMode){ state.scheduleMode=scheduleMode.dataset.scheduleMode; render(); return; }
        if(e.target.closest('[data-toggle-calendar-panel]')){ state.scheduleCalendarOpen=!state.scheduleCalendarOpen; render(); return; }
        if(e.target.closest('[data-close-competency]')){ state.activeCompetencyMacro=null; state.competencyAdding=false; state.competencyEvaluationKey=null; render(); return; }
        const competencyMacro=e.target.closest('[data-competency-macro]'); if(competencyMacro){ const key=competencyMacro.dataset.competencyMacro; state.activeCompetencyMacro=state.activeCompetencyMacro===key?null:key; state.competencyAdding=false; state.competencyEvaluationKey=null; render(); return; }
        const addCompetency=e.target.closest('[data-add-personal-competency]'); if(addCompetency){ state.activeCompetencyMacro=addCompetency.dataset.addPersonalCompetency; state.competencyAdding=true; state.competencyEvaluationKey=null; render(); return; }
        if(e.target.closest('[data-cancel-competency-add]')){ state.competencyAdding=false; render(); return; }
        const startEvaluation=e.target.closest('[data-start-competency-evaluation]'); if(startEvaluation){ const key=startEvaluation.dataset.startCompetencyEvaluation; state.activeCompetencyMacro=key; state.competencyEvaluationKey=key; state.competencyAdding=false; render(); return; }
        if(e.target.closest('[data-cancel-competency-evaluation]')){ state.competencyEvaluationKey=null; render(); return; }
        if(e.target.closest('[data-cancel-note-composer]')){ state.noteComposer=false; render(); return; }
        const openRoleDefinition=e.target.closest('[data-open-role-definition]'); if(openRoleDefinition){ const id=openRoleDefinition.dataset.openRoleDefinition; state.activeRoleDefinition=id; state.roleDefinitionTab='mansionario'; state.roleMansionarioEditing=false; state.roleCompetencyAdding=false; render(); requestAnimationFrame(()=>document.getElementById('roleWorkspace')?.scrollIntoView({behavior:'smooth',block:'nearest'})); return; }
        if(e.target.closest('[data-close-role-definition]')){ state.activeRoleDefinition=null; state.roleMansionarioEditing=false; state.roleCompetencyAdding=false; render(); return; }
        const roleDefinitionTab=e.target.closest('[data-role-definition-tab]'); if(roleDefinitionTab){ state.roleDefinitionTab=roleDefinitionTab.dataset.roleDefinitionTab; state.roleMansionarioEditing=false; state.roleCompetencyAdding=false; render(); return; }
        if(e.target.closest('[data-edit-role-mansionario]')){ state.roleMansionarioEditing=true; render(); return; }
        if(e.target.closest('[data-cancel-role-mansionario]')){ state.roleMansionarioEditing=false; render(); return; }
        if(e.target.closest('[data-add-role-competency]')){ state.roleCompetencyAdding=true; render(); return; }
        if(e.target.closest('[data-cancel-role-competency]')){ state.roleCompetencyAdding=false; render(); return; }
        const hideCompetency=e.target.closest('[data-hide-competency]'); if(hideCompetency){ const item=competencyMacroData[hideCompetency.dataset.macroKey]; const row=item?.rows.find(entry=>entry.id===hideCompetency.dataset.hideCompetency); if(row){ row.hidden=true; render(); toast('Voce nascosta dal profilo individuale'); } return; }
        const restoreCompetency=e.target.closest('[data-restore-competency]'); if(restoreCompetency){ const item=competencyMacroData[restoreCompetency.dataset.macroKey]; const row=item?.rows.find(entry=>entry.id===restoreCompetency.dataset.restoreCompetency); if(row){ row.hidden=false; render(); toast('Voce ripristinata nel profilo individuale'); } return; }
        const manageBase=e.target.closest('[data-manage-base-profile]'); if(manageBase){ state.baseProfileMacro=manageBase.dataset.manageBaseProfile; state.baseProfileSource='Profilo generale'; openBaseProfileManager(state.baseProfileMacro); return; }
        const baseMacro=e.target.closest('.base-source-tab[data-base-macro]'); if(baseMacro){ state.baseProfileMacro=baseMacro.dataset.baseMacro; openBaseProfileManager(state.baseProfileMacro); return; }
        const baseSource=e.target.closest('.base-source-tab[data-base-source]'); if(baseSource){ state.baseProfileSource=baseSource.dataset.baseSource; openBaseProfileManager(state.baseProfileMacro); return; }
        const toggleBase=e.target.closest('[data-toggle-base-voice]'); if(toggleBase){ const item=competencyMacroData[toggleBase.dataset.macroKey]; const row=item?.rows.find(entry=>entry.id===toggleBase.dataset.toggleBaseVoice); const source=toggleBase.dataset.baseSource; if(row&&source){ row.disabledSources=row.disabledSources||[]; const index=row.disabledSources.indexOf(source); if(index>=0) row.disabledSources.splice(index,1); else row.disabledSources.push(source); render(); openBaseProfileManager(toggleBase.dataset.macroKey); toast(index>=0?'Voce riattivata nel profilo base':'Voce disattivata dal profilo base'); } return; }
        const modal=e.target.closest('[data-modal]'); if(modal){ openModal(modal.dataset.modal); return; }
        const close=e.target.closest('[data-close-modal]'); if(close&&(close.tagName==='BUTTON'||close===e.target)){ closeModal(); return; }
        const sw=e.target.closest('[data-switch]'); if(sw){ sw.classList.toggle('on'); return; }
        if(e.target.closest('[data-critical-switch]')){ state.criticalOnly=!state.criticalOnly; render(); return; }
        const t=e.target.closest('[data-toast]'); if(t){ toast(t.dataset.toast); }
      });

      document.addEventListener('keydown', e => {
        const row=e.target.closest('[data-open-person]');
        if(row && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); row.click(); }
        if(e.key==='Escape' && document.querySelector('.modal-layer')) closeModal();
      });

      document.addEventListener('input', e => {
        if(e.target.matches('[data-profile-input]')){ state.profileDirty=true; const bar=document.querySelector('.edit-status-bar'); if(bar) bar.innerHTML=`<span>${dotStatus('orange','Modifiche non salvate')}</span><span>I dati verranno registrati soltanto con “Salva modifiche”.</span>`; }
        if(e.target.id==='matrixDetailSearch') filterMatrixDetail();
        if(e.target.id==='peopleSearch'){
          state.peopleQuery=e.target.value;
          const q=e.target.value.trim().toLowerCase();
          document.querySelectorAll('#peopleRows tr').forEach(row=>row.classList.toggle('hidden',q && !row.dataset.search.includes(q)));
        }
        if(e.target.id==='railSearch'){
          const q=e.target.value.trim().toLowerCase();
          document.querySelectorAll('#railPeople .rail-person').forEach(row=>row.classList.toggle('hidden',q && !row.dataset.name.includes(q)));
        }
      });

      document.addEventListener('change', e => {
        if(e.target.matches('[data-matrix-filter]')) filterMatrixDetail();
      });

      document.addEventListener('submit', e => {
        e.preventDefault();
        if(e.target.id==='noteForm') { const text=document.getElementById('noteText'); if(!text.value.trim()){ toast('Scrivi una nota prima di salvarla'); return; } state.noteComposer=false; render(); toast('Nota salvata'); return; }
        if(e.target.id==='roleMansionarioForm'){
          const role=roleDefinitions[e.target.dataset.roleId];
          if(!role) return;
          const lines=name=>e.target.elements[name].value.split('\n').map(value=>escapeHtml(value.trim())).filter(Boolean);
          role.purpose=escapeHtml(e.target.elements.rolePurpose.value.trim());
          role.activities=lines('roleActivities');
          role.responsibilities=lines('roleResponsibilities');
          role.authority=lines('roleAuthority');
          role.reportsTo=escapeHtml(e.target.elements.roleReportsTo.value.trim());
          role.collaboratesWith=escapeHtml(e.target.elements.roleCollaboratesWith.value.trim());
          state.roleMansionarioEditing=false;
          render();
          toast(`Mansionario di ${role.title} salvato`);
          return;
        }
        if(e.target.id==='roleCompetencyForm'){
          const role=roleDefinitions[e.target.dataset.roleId];
          const key=e.target.elements.roleCompetencyMacro.value;
          const item=competencyMacroData[key];
          const name=e.target.elements.roleCompetencyName.value.trim();
          const description=e.target.elements.roleCompetencyDescription.value.trim()||'Voce prevista dal profilo del ruolo';
          if(!role||!item||!name){ toast('Completa i dati della voce base'); return; }
          item.rows.push({id:`role-${Date.now()}`,name:escapeHtml(name),description:escapeHtml(description),sources:[`Ruolo: ${role.title}`],level:null,levelNumber:null,updated:'—',evaluator:'—',personal:false,hidden:false,history:[]});
          state.roleCompetencyAdding=false;
          render();
          toast(`Voce aggiunta al ruolo ${role.title}`);
          return;
        }
        if(e.target.id==='competencyPersonalForm'){
          const key=e.target.dataset.macroKey;
          const item=competencyMacroData[key];
          const name=e.target.elements.competencyName.value.trim();
          const description=e.target.elements.competencyDescription.value.trim()||'Voce personalizzata per la singola persona';
          if(!item||!name){ toast('Inserisci il nome della voce personale'); return; }
          item.rows.push({id:`personal-${Date.now()}`,name:escapeHtml(name),description:escapeHtml(description),sources:['Voce personale'],level:null,levelNumber:null,updated:'—',evaluator:'—',personal:true,hidden:false});
          state.competencyAdding=false;
          render();
          toast('Voce personale aggiunta al profilo');
          return;
        }
        if(e.target.id==='baseProfileForm'){
          const key=e.target.dataset.macroKey;
          const source=e.target.dataset.baseSource;
          const item=competencyMacroData[key];
          const name=e.target.elements.baseCompetencyName.value.trim();
          const description=e.target.elements.baseCompetencyDescription.value.trim()||'Voce configurata nel profilo aziendale';
          if(!item||!source||!name){ toast('Inserisci il nome della voce del profilo'); return; }
          item.rows.push({id:`base-${Date.now()}`,name:escapeHtml(name),description:escapeHtml(description),sources:[source],level:null,levelNumber:null,updated:'—',evaluator:'—',personal:false,hidden:false,history:[]});
          render();
          openBaseProfileManager(key);
          toast(`Voce aggiunta a ${source}`);
          return;
        }
        if(e.target.id==='competencyEvaluationForm'){
          const key=e.target.dataset.macroKey;
          const item=competencyMacroData[key];
          if(!item) return;
          const date=formatDateIt(e.target.elements.evaluationDate.value);
          const evaluator=escapeHtml(e.target.elements.evaluationEvaluator.value.trim()||'Utente corrente');
          e.target.querySelectorAll('[data-evaluation-row]').forEach(select=>{
            const row=item.rows.find(entry=>entry.id===select.dataset.evaluationRow);
            if(!row) return;
            row.history=row.history||[];
            if(Number.isInteger(row.levelNumber)) row.history.push({level:row.level,levelNumber:row.levelNumber,date:row.updated,evaluator:row.evaluator,note:row.lastNote||''});
            const value=Number(select.value);
            row.levelNumber=value;
            row.level={1:'Base',2:'Intermedio',3:'Avanzato'}[value];
            row.updated=date;
            row.evaluator=evaluator;
            const note=e.target.querySelector(`[data-evaluation-note="${row.id}"]`)?.value.trim();
            if(note) row.lastNote=escapeHtml(note);
          });
          item.updated=date;
          state.competencyEvaluationKey=null;
          render();
          toast(`Valutazione di ${item.title} salvata`);
          return;
        }
        if(e.target.id==='modalForm'){ closeModal(); toast('Informazioni salvate nel prototipo'); }
      });

      render();
    })();
  </script>
</body>
</html>
